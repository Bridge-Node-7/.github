name: Improvement
description: Suggest a documentation or product improvement
title: "improvement: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Proposal
      description: Describe the proposed public behavior using public or synthetic information only.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Acceptance criteria
      description: How can the change be verified?
    validations:
      required: false
